name: budgetopia
description: A money manager application for personal use.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  another_flushbar: ^1.12.30                        #Notificações na parte inferior
  adaptive_theme: ^3.7.0                            #Alterar o tema do aplicativo
  animations: ^2.0.11                               #Efeitos de animações prontos
  animated_list_plus: ^0.5.2
  fl_chart: ^0.70.2                                 #Gráficos
  flex_color_scheme:  ^8.2.0                        #Controla o tema do aplicativo
  flutter_native_splash: ^2.4.6
  flutter_zoom_drawer: ^3.2.0                       #Drawer
  font_awesome_flutter: ^10.8.0                     #Mais ícones
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  lottie: ^3.3.1                                    #Animações
  objectbox: ^4.3.0                                 #Armazenamento de dados
  objectbox_flutter_libs: ^4.3.0                    #Armazenamento de dados
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^12.0.1
  rflutter_alert: ^2.0.7
  meta: ^1.15.0
  flutter_ddi:
    path: ../flutter_ddi

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.5.4

  #flutter_launcher_icons: "^0.13.1"
  objectbox_generator: ^4.3.0

objectbox:
  # Writes objectbox-model.json and objectbox.g.dart to lib/custom (and test/custom).
  output_dir: "config/banco/generated"


flutter_native_splash:
  background_image: "assets/app/splash.png"
  color: "#b5f2b0"
  color_dark: "#003822"
  android: true
  android_gravity: fill_vertical

  android_12:
    background_image: "assets/app/splash.png"

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/app/
    - assets/icons/